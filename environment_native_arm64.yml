name: ttstl_silicon
channels:
  - conda-forge
  - r
dependencies:
  # Core Python environment - Relaxed to allow compatible patch versions
  - python>=3.9.23,<3.10
  
  # Core scientific computing stack
  - numpy>=2.0.2
  - pandas>=2.3.1
  - scipy>=1.13.1
  
  # Jupyter environment
  - jupyter>=1.1.1
  - jupyterlab>=4.4.5
  
  # Visualization
  - matplotlib>=3.9.4
  - seaborn>=0.13.2
  
  # R environment - Build strings removed for cross-platform compatibility
  # Note: r-funitroots and r-rugarch are intentionally EXCLUDED here.
  # They must be installed from source on Apple Silicon.
  - r-base=4.3.3
  - r-urca>=1.3
  - r-glmnet>=4.1
  - r-weightedporttest>=1.1
  - r-ggplot2=3.5.2
  - r-readr=2.1.5
  - r-dplyr=1.1.4
  - r-nloptr  # Required for rugarch
  - r-remotes

  
  # R-Python interface
  - rpy2=3.5.11
  
  # Package manager
  - pip=23.2.1
  
  # Python packages via pip with Environment Markers
  - pip:
    # Cloud storage
    - google-cloud-storage>=3.3.0
    - gcsfs>=2025.7.0
    - pyarrow>=18.1.0
    - tqdm>=4.67.1
    
    # --- Intelligent PyTorch Selection ---
    # The --extra-index-url allows pip to find the CUDA versions on Linux.
    # On Mac/Windows, pip will check this URL, find no matching wheels, and fall back to PyPI.
    - "--extra-index-url https://download.pytorch.org/whl/cu118"
    
    # If Linux: Install CUDA 11.8 specific versions (Runs on GPU or CPU)
    - "torch==2.5.0+cu118; sys_platform == 'linux'"
    - "torchaudio==2.5.0+cu118; sys_platform == 'linux'"
    - "torchvision==0.20.0+cu118; sys_platform == 'linux'"
    
    # If NOT Linux (Mac/Windows): Install standard versions (Native acceleration supported)
    - "torch==2.5.0; sys_platform != 'linux'"
    - "torchaudio==2.5.0; sys_platform != 'linux'"
    - "torchvision==0.20.0; sys_platform != 'linux'"
    
    # Machine learning
    - scikit-learn>=1.6.1
    - statsmodels>=0.14.5
    
    # Testing
    - pytest>=8.4.1