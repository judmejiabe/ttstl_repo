name: ttstl_dev
channels:
  - conda-forge
  - r
dependencies:
  # Core Python environment - frozen for reproducibility
  - python=3.9.23
  
  # Core scientific computing stack - exact versions
  - numpy=2.0.2
  - pandas=2.3.1
  - scipy=1.13.1
  
  # Jupyter environment - exact versions
  - jupyter=1.1.1
  - jupyterlab=4.4.5
  
  # Visualization - exact versions
  - matplotlib=3.9.4
  - seaborn=0.13.2
  
  # R environment - exact versions for GARCH analysis reproducibility
  - r-base=4.3.3
  - r-urca=1.3_4
  - r-funitroots=3042.79
  - r-glmnet=4.1_10
  - r-rugarch=1.5_1
  - r-weightedporttest=1.1
  - r-ggplot2=3.5.2
  - r-readr=2.1.5
  - r-dplyr=1.1.4
  
  # R-Python interface - exact version critical
  - rpy2=3.5.11
  
  # Package manager
  - pip=23.2.1
  
  # Python packages via pip - exact versions for reproducibility
  - pip:
    # Cloud storage - exact versions
    - google-cloud-storage==3.3.0
    - gcsfs==2025.7.0
    - numexpr==2.10.2
    - pyarrow==18.1.0
    
    # PyTorch ecosystem - keep exact versions with CUDA
    - --extra-index-url https://download.pytorch.org/whl/cu118
    - torch==2.5.0+cu118
    - torchaudio==2.5.0+cu118
    - torchvision==0.20.0+cu118
    
    # Machine learning - exact versions
    - scikit-learn==1.6.1
    - statsmodels==0.14.5
    
    # Testing - exact version
    - pytest==8.4.1